<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#100f0d"/>
      <stop offset="55%" stop-color="#1c1b1a"/>
      <stop offset="100%" stop-color="#14130f"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#f2a93b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f2a93b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="78%" r="45%">
      <stop offset="0%" stop-color="#2f4b3c" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2f4b3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd58a" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#f2a93b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f2a93b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <rect width="1600" height="900" fill="url(#glow2)"/>
  <circle cx="1370" cy="140" r="46" fill="#ede8de" opacity="0.9"/>
  <circle cx="1370" cy="140" r="70" fill="#ede8de" opacity="0.08"/>

  <!-- distant hills -->
  <path d="M0 620 Q250 560 500 610 T1000 600 T1600 630 V900 H0 Z" fill="#14130f"/>

  <!-- main building -->
  <rect x="330" y="430" width="620" height="290" fill="#2a2826"/>
  <rect x="330" y="410" width="620" height="24" fill="#1c1b1a"/>
  <!-- second storey -->
  <rect x="420" y="330" width="440" height="110" fill="#241f1c"/>

  <!-- windows grid, lit amber -->
  <g fill="#f2a93b" opacity="0.85">
    <rect x="365" y="470" width="46" height="60"/>
    <rect x="445" y="470" width="46" height="60"/>
    <rect x="525" y="470" width="46" height="60" opacity="0.3"/>
    <rect x="605" y="470" width="46" height="60"/>
    <rect x="685" y="470" width="46" height="60" opacity="0.3"/>
    <rect x="765" y="470" width="46" height="60"/>
    <rect x="845" y="470" width="46" height="60"/>
    <rect x="365" y="565" width="46" height="60" opacity="0.3"/>
    <rect x="445" y="565" width="46" height="60"/>
    <rect x="525" y="565" width="46" height="60"/>
    <rect x="605" y="565" width="46" height="60" opacity="0.3"/>
    <rect x="685" y="565" width="46" height="60"/>
    <rect x="765" y="565" width="46" height="60"/>
    <rect x="845" y="565" width="46" height="60" opacity="0.3"/>
    <rect x="450" y="360" width="46" height="50"/>
    <rect x="530" y="360" width="46" height="50" opacity="0.3"/>
    <rect x="610" y="360" width="46" height="50"/>
    <rect x="690" y="360" width="46" height="50"/>
    <rect x="770" y="360" width="46" height="50" opacity="0.3"/>
  </g>

  <!-- entrance canopy + sign -->
  <rect x="590" y="640" width="200" height="80" fill="#100f0d"/>
  <rect x="560" y="615" width="260" height="18" fill="#c0392b"/>
  <rect x="620" y="618" width="140" height="10" fill="#ede8de" opacity="0.85"/>

  <!-- highway foreground -->
  <rect x="0" y="760" width="1600" height="140" fill="#14130f"/>
  <g stroke="#f2a93b" stroke-width="8" opacity="0.55" stroke-linecap="round">
    <line x1="60" y1="830" x2="180" y2="830"/>
    <line x1="260" y1="830" x2="380" y2="830"/>
    <line x1="460" y1="830" x2="580" y2="830"/>
    <line x1="660" y1="830" x2="780" y2="830"/>
    <line x1="860" y1="830" x2="980" y2="830"/>
    <line x1="1060" y1="830" x2="1180" y2="830"/>
    <line x1="1260" y1="830" x2="1380" y2="830"/>
    <line x1="1460" y1="830" x2="1580" y2="830"/>
  </g>

  <!-- lamp posts casting glow -->
  <circle cx="300" cy="560" r="90" fill="url(#lamp)"/>
  <rect x="296" y="600" width="8" height="160" fill="#100f0d"/>
  <circle cx="1020" cy="560" r="90" fill="url(#lamp)"/>
  <rect x="1016" y="600" width="8" height="160" fill="#100f0d"/>
</svg>
